name: Bug report
description: Report reproducible incorrect behavior.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for providing enough information to reproduce the problem.
  - type: input
    id: version
    attributes:
      label: Version or revision
      placeholder: 0.1.0.dev0 or a commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include Python version and operating system.
      placeholder: Python 3.13.1 on macOS 15.1
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest complete sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include logs, tracebacks, or a random seed when relevant. Remove secrets first.
