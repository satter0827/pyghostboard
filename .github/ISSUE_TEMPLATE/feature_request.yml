name: Feature request
description: Propose a focused capability or improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or developer problem without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior and success criteria.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List current workarounds or simpler alternatives.
  - type: textarea
    id: scope
    attributes:
      label: Scope and compatibility
      description: Note affected APIs, tests, documentation, or architecture boundaries.
