name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  matrix-configuration:
    name: Matrix / Configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      compatibility: ${{ steps.configuration.outputs.compatibility }}
      primary-python: ${{ steps.configuration.outputs.primary-python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: configuration
        run: |
          echo "compatibility=$(python3 scripts/release_gate.py matrix)" >> "$GITHUB_OUTPUT"
          echo "primary-python=$(python3 scripts/release_gate.py primary-python)" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality
    needs: matrix-configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ needs.matrix-configuration.outputs.primary-python }}
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run python scripts/release_gate.py check quality

  unit:
    name: Unit
    needs: matrix-configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ needs.matrix-configuration.outputs.primary-python }}
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run python scripts/release_gate.py check unit

  integration:
    name: Integration
    needs: matrix-configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ needs.matrix-configuration.outputs.primary-python }}
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run python scripts/release_gate.py check integration

  package:
    name: Package
    needs: matrix-configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ needs.matrix-configuration.outputs.primary-python }}
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run python scripts/release_gate.py check package --commit "$GITHUB_SHA"

  security-dependencies:
    name: Security / Dependencies
    needs: matrix-configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: python3 scripts/release_gate.py check dependencies

  compatibility-matrix:
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      github.ref == 'refs/heads/main'
    name: Compatibility / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: matrix-configuration
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix-configuration.outputs.compatibility) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: >-
          uv run python scripts/release_gate.py check compatibility
          --scope "${{ matrix.scope }}"

  compatibility:
    if: >-
      always() && (
        (github.event_name == 'pull_request' && github.base_ref == 'main') ||
        github.ref == 'refs/heads/main'
      )
    name: Compatibility
    needs: compatibility-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: test "${{ needs.compatibility-matrix.result }}" = "success"

  main-source:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    name: Main / Source Branch
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require develop from this repository
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          test "$HEAD_REF" = "develop"
          test "$HEAD_REPOSITORY" = "${{ github.repository }}"

  develop-gate:
    if: >-
      always() && !(
        (github.event_name == 'pull_request' && github.base_ref == 'main') ||
        github.ref == 'refs/heads/main'
      )
    name: Develop Gate
    needs: [quality, unit, integration, package, security-dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: |
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.unit.result }}" = "success"
          test "${{ needs.integration.result }}" = "success"
          test "${{ needs.package.result }}" = "success"
          test "${{ needs.security-dependencies.result }}" = "success"

  release-gate:
    if: >-
      always() && (
        (github.event_name == 'pull_request' && github.base_ref == 'main') ||
        github.ref == 'refs/heads/main'
      )
    name: Release Gate
    needs: [quality, unit, integration, package, security-dependencies, compatibility, main-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: |
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.unit.result }}" = "success"
          test "${{ needs.integration.result }}" = "success"
          test "${{ needs.package.result }}" = "success"
          test "${{ needs.security-dependencies.result }}" = "success"
          test "${{ needs.compatibility.result }}" = "success"
          test "${{ needs.main-source.result }}" = "success" -o \
            "${{ needs.main-source.result }}" = "skipped"
