name: Release Artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version in X.Y.Z form
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Release verified distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
      - run: git fetch origin main --tags
      - name: Require the current main commit
        run: test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - name: Require successful main Release Gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow CI \
            --branch main \
            --commit "$GITHUB_SHA" \
            --event push \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion')"
          test "$conclusion" = "success"
      - run: uv sync --locked --group dev
      - name: Build and verify the release
        env:
          VERSION: ${{ inputs.version }}
        run: >-
          uv run python scripts/release_gate.py release
          --version "$VERSION"
          --commit "$GITHUB_SHA"
          --dist-dir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions-${{ inputs.version }}
          path: dist/
      - name: Create the verified tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tag="v$VERSION"
          remote_commit="$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)"
          if test -n "$remote_commit"; then
            test "$remote_commit" = "$GITHUB_SHA"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
