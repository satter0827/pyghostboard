name: Release Artifact

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release tag
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - run: git fetch origin main
      - name: Require the tagged commit to be the current main commit
        run: test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - run: uv sync --locked --group dev
      - run: uv run python tools/write_build_info.py "$GITHUB_SHA"
      - run: uv run pytest tests/unit tests/integration
      - name: Build the exact tagged version
        run: |
          version="${GITHUB_REF_NAME#v}"
          SETUPTOOLS_SCM_PRETEND_VERSION="$version" uv build --clear
          uv run python tools/verify_distribution.py "$version" dist --commit "$GITHUB_SHA"
      - run: uv run twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions
          path: dist/
