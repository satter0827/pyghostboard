[project]
name = "pyghostboard"
dynamic = ["version"]
description = "A typed Python engine for a hidden-information board game with fair AI."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
authors = [
    { name = "pyghostboard contributors" },
]
keywords = [
    "artificial-intelligence",
    "board-game",
    "hidden-information",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.15.0,<3",
    "rich>=14.1,<15",
    "structlog>=25.4,<27",
    "typer>=0.27.1,<1",
]

[project.scripts]
pyghostboard = "pyghostboard.cli:main"

[project.urls]
Homepage = "https://github.com/satter0827/pyghostboard"
Documentation = "https://github.com/satter0827/pyghostboard/blob/main/docs/README.md"
Repository = "https://github.com/satter0827/pyghostboard"
Issues = "https://github.com/satter0827/pyghostboard/issues"

[dependency-groups]
dev = [
    "babel>=2.17,<3",
    "build>=1.2,<2",
    "hatchling>=1.32.0,<2",
    "hatch-vcs>=0.5,<1",
    "hypothesis>=6.165.5,<7",
    "import-linter>=2.5,<3",
    "jsonschema>=4.25,<5",
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
    "twine>=6,<7",
    "types-jsonschema>=4.25,<5",
]

[tool.uv]
required-version = "==0.12.1"

[build-system]
requires = ["hatchling>=1.32.0,<2", "hatch-vcs>=0.5,<1"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0.dev0"

[tool.hatch.version.raw-options]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.hatch.build.targets.wheel]
packages = ["src/pyghostboard"]

[tool.hatch.build.targets.sdist]
only-include = [
    "LICENSE",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "README.md",
    "README.ja.md",
    "SECURITY.md",
    "docs/README.md",
    "docs/design",
    "examples",
    "pyproject.toml",
    "src",
    "tools/hatch_build.py",
]

[tool.hatch.build.hooks.custom]
path = "tools/hatch_build.py"

[tool.quality-gate]
primary-python = "3.13"
compatibility = [
    { os = "ubuntu-24.04", python-version = "3.11", scope = "full" },
    { os = "ubuntu-24.04", python-version = "3.12", scope = "full" },
    { os = "ubuntu-24.04", python-version = "3.13", scope = "full" },
    { os = "ubuntu-24.04", python-version = "3.14", scope = "full" },
    { os = "macos-15", python-version = "3.13", scope = "full" },
    { os = "windows-2025", python-version = "3.13", scope = "domain" },
]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
cache_dir = ".pyghostboard/cache/pytest"
testpaths = ["tests"]
tmp_path_retention_policy = "failed"

[tool.importlinter]
root_package = "pyghostboard"

[[tool.importlinter.contracts]]
name = "Application depends only on domain"
type = "layers"
layers = [
    "pyghostboard.cli",
    "pyghostboard.adapters",
    "pyghostboard.application | pyghostboard.protocol",
    "pyghostboard.domain",
]

[tool.ruff]
cache-dir = ".pyghostboard/cache/ruff"
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
cache_dir = ".pyghostboard/cache/mypy"
files = ["src", "tests", "scripts", "tools"]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["hatchling.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
data_file = ".pyghostboard/coverage/data"
source = ["pyghostboard"]
omit = [
    "*/agent_runner.py",
]

[tool.coverage.report]
fail_under = 90
precision = 0
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = ".pyghostboard/coverage/html"

[tool.coverage.json]
output = ".pyghostboard/coverage/coverage.json"

[tool.coverage.lcov]
output = ".pyghostboard/coverage/coverage.lcov"

[tool.coverage.xml]
output = ".pyghostboard/coverage/coverage.xml"
